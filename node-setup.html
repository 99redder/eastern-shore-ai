  <script>
    const appDisclaimer = `<p style="margin-top:1.2rem; padding-top:.75rem; border-top:1px solid rgba(158,208,255,.12); font-size:.78rem; color:var(--muted); line-height:1.65;"><strong style="color:var(--text);">Third-Party Software Disclaimer:</strong> This application is independently developed software. Eastern Shore AI, LLC has no partnership, affiliation, sponsorship, or arrangement of any kind with the developer(s) or vendor(s) of this software. All product names, brand names, and trademarks are the property of their respective owners and are referenced here solely for informational and identification purposes. This software is provided as-is; your use of it is entirely at your own risk. Eastern Shore AI, LLC makes no warranties — express or implied — regarding the accuracy, reliability, or fitness of any third-party application for any particular purpose.</p>`;

    // The User Guide app's update steps, shown under Maintenance and in the User Guide App section.
    const guideUpdateSteps = `<ol>
                 <li>Connect the phone to Wi-Fi that has working internet, then open the <strong>User Guide</strong> app.</li>
                 <li>If a newer version exists, an orange <strong>Guide update available</strong> note appears at the top. Tap <strong>Update</strong>, and when a box asks to <strong>Download File</strong>, tap <strong>YES</strong>. The download takes a few seconds and runs in the background.</li>
                 <li>Swipe down from the top of the screen and tap the downloaded file. You can also open <strong>File Manager → Download</strong> and tap it there.</li>
                 <li>If Android says it isn't allowed to install unknown apps from this source, tap <strong>Settings</strong> and turn on <strong>Allow from this source</strong>. If the update box doesn't appear by itself, tap the back arrow.</li>
                 <li>When Android asks "Do you want to update this app?", tap <strong>Update</strong>, then <strong>Open</strong>.</li>
                 <li>Check the version number at the bottom of the guide.</li>
               </ol>
               <p style="color:var(--muted); font-size:.9rem;"><em>The update installs over your current guide; nothing else on your phone changes. If no note appears, you already have the latest guide.</em></p>
               <p><strong>If the guide shows "Webpage not available" on Wi-Fi:</strong> that Wi-Fi has no working internet. Turn Wi-Fi off and open the guide again; it opens normally. Try the update later on a working connection.</p>
               <p><strong>Get an email when there's a new guide:</strong> pictures of each step, what's new in each version, and an email sign-up for new guides are at <a href="/guide-update.html#get-updates" style="color:var(--cyan)">easternshore.ai/guide-update</a>. On the Survival Node, type the address into <strong>Fennec</strong>'s address bar while on Wi-Fi.</p>
               <p><strong>Bought your kit on eBay?</strong> eBay doesn't share your email address with us, so signing up there is the only way we can tell you when a new guide comes out.</p>`;

    // The Survival Node Pal's instructions (survival_prompt.txt on the phone; rewritten 2026-11-17).
    // Shown in the PocketPal section and in Maintenance > Update the Survival Node Pal; keep in step with the guide app.
    const palPromptBox = `<pre style="background:#070910; border:1px solid rgba(158,208,255,.2); border-left:3px solid var(--cyan); border-radius:0 6px 6px 0; padding:.85rem 1rem; margin:.5rem 0 .9rem; font-size:.78rem; color:var(--ok); white-space:pre-wrap; line-height:1.65; font-family:'Courier New',monospace;">Survival Node instructions, updated November 18, 2026

You are Survival Node, an offline advisor for survival, first aid and field repair. The person asking may be in a real emergency with no internet and no way to check your answer, so being correct matters more than being complete.

Rules:
1. Answer right away, with no greetings or filler.
2. If the topic can hurt someone (medical care, drinking water, food, fire, electricity, chemicals), start with a short **CRITICAL SAFETY WARNING**.
3. Give the standard, proven method first: the one the CDC, Red Cross, FEMA or the U.S. Army teaches. Then give backups, and say what each backup can't do.
4. Never make up a number. Give a measurement, dose, ratio or time only if it is a well-known standard. If you aren't sure of a number, say so and point to the Survival Manual or WikiMed on this phone.
5. Never call something safe to drink, eat or use unless the steps you gave make it safe.
6. Use numbered steps for procedures and short bullet lists for supplies.
7. Assume no internet and limited supplies. Improvise only with methods known to work.
8. For a serious injury or illness, say to get medical help as soon as possible.

Drinking water (CDC):
- Filtering through cloth or letting water settle only makes it clearer. It must still be boiled or disinfected.
- Boil: a rolling boil for 1 minute (3 minutes above 6,500 feet). Boiling kills bacteria, viruses and parasites, including Giardia and Cryptosporidium.
- Bleach, only if you can't boil: plain, unscented household bleach (5-9%). If the water is cloudy, let it settle or filter it through cloth first. Give the amount only by copying this sentence word for word, and give no other bleach amounts: "Add 8 drops (1/8 teaspoon) of bleach to each gallon of water, stir, and wait 30 minutes." For more water, say to repeat that for each gallon.
- Boiling and bleach don't remove fuel or chemicals. Find another water source.

If someone asks which version of your instructions you have, answer only: "Survival Node instructions, updated November 18, 2026."</pre>`;

    const sections = [
      {
        title: 'Initial Setup',
        html: `<p><strong>Do the "First Steps" below immediately after delivery.</strong></p>
               <p>Your Survival Node is built around an <strong>offline-first philosophy</strong> — the maps, AI models, and reference libraries on this device are designed to work without internet access, cell signal, or a service account. You do not need a SIM card or service plan for any of its core capabilities.</p>
               <p><strong>About Your Packaging</strong></p>
               <p style="color:var(--muted); font-size:.9rem;">Your Survival Node ships in a standard cardboard box which may display the logo or branding of another company. This is standard supply chain practice and does not indicate any partnership or affiliation between that company and Eastern Shore AI, LLC.</p>
               <p style="color:var(--muted); font-size:.9rem;"><strong>What you'll find inside the hard case:</strong> The phone arrives wrapped in protective bubble wrap packaging. The solar battery arrives in its original manufacturer packaging (opened, inspected, tested, and repacked before shipment). The two Mission Darkness Faraday bags will be in their original packaging and placed under the hard case inside the shipping box — not inside the case itself. Complete the First Steps below, then place the phone and solar battery into their Faraday bags before sealing the case for storage.</p>
               <p><strong>What's in the Box</strong></p>
               <ul>
                 <li>Survival Node phone — debloated Android OS, optimized for performance and longevity, pre-loaded with 50GB+ survival apps and 2 offline LLMs — wall charger, USB-C cable, and shockproof phone case with screen protector included</li>
                 <li>Premium 24,000 mAh Solar Battery — rugged, drop- and splash-resistant — with 3 attached cables (2× USB-C, 1× iOS) plus a USB-A output on the side, built-in flashlight, and emergency strobe</li>
                 <li>(2) Mission Darkness Faraday Bags — premium EMP-rated signal-blocking, one for phone, one for solar battery</li>
                 <li>Weatherproof hard storage case with padlock and a premium rechargeable desiccant pouch (silica gel with a blue indicator dot)</li>
                 <li>Full Survival Node User Guide — available as an app on the home screen (it checks for guide updates whenever you open it on Wi-Fi); the standard PDF version is also pre-loaded on the device in the Download folder</li>
               </ul>
               <p><strong>Your home screen:</strong> Every preloaded app is on one screen, in A to Z order, Camera and Clock included. The bottom row has the User Guide, Settings and PocketPal, and the phone's other built-in tools, such as Calculator, Recorder, FM Radio, Contacts and Phone, are in the Tools folder. On phones prepared from November 16, 2026, the Clock is Fossify Clock and Tools has two Phone apps: Fossify Phone (the green icon) and Google's original Phone app, which stays on the phone in case you need it for an emergency call, though calls may not work (see SIM Card &amp; Cellular Connectivity below). Use Fossify Phone. If Google's Phone ever asks to become your default phone app, decline, or the startup notices described in Troubleshooting may come back. Kits shipped before November 18, 2026 have Phone, Settings and Camera in the bottom row and Clock in Tools, and phones prepared before November 16 have Google's Phone and Clock.</p>
               <p><strong>First Steps</strong></p>
               <p style="color:var(--muted); font-size:.9rem;"><em>Note: Your Survival Node phone arrives charged to about 60–80%, where its final battery test leaves it.</em></p>
               <ul>
                 <li><strong>Charge the solar battery:</strong> Plug your solar battery into wall power using the included charger. You can charge to 100% (all 4 blue LEDs solid) to verify it's working correctly, then bring it back down to <strong>2–3 of the 4 blue LEDs (50–75%)</strong> before sealing for long-term storage.</li>
                 <li><strong>Bring the phone to about 60%:</strong> use it a little, or charge it with the included wall charger and USB-C cable if it's lower, then power it completely off. Do not store it fully charged or fully drained.</li>
                 <li><strong>Set up the desiccant:</strong> Throw away the small white packet (it's only for shipping), then take the premium desiccant pouch out of its plastic bag and put it in the case. This is the kit's long-term moisture protection.</li>
                 <li><strong>Seal for readiness:</strong> Place the phone and solar battery into their Faraday bags, fold the top over at least twice (leave the phone in its case), seal tightly, then store both in the case with the desiccant pouch.</li>
               </ul>
               <p><strong>Storage Conditions</strong></p>
               <img src="/images/benchmarks/hard-case-specs.png" alt="Hard case spec diagram showing dimensions, IP67 rating, and protective features" style="width:100%; max-width:480px; display:block; margin:0 auto 1rem; border-radius:8px; border:1px solid rgba(255,255,255,.1);" onerror="this.style.display='none'" />
               <p>Store your Survival Node in a cool, dry location — between 60°F (15°C) and 85°F (30°C), ideally 60–75°F (15–24°C). Avoid cars, attics, and garages where temperatures reach damaging extremes. The included premium desiccant pouch (silica gel) absorbs moisture and is reusable; recharge it when the <strong>blue indicator dot turns light pink</strong>. To recharge, place the pouch with the indicator dot facing up and microwave it for <strong>3–5 minutes</strong>. Once the dot turns blue again, the pouch is ready to reuse. Store the case upright, away from direct sunlight.</p>
               <p style="color:var(--muted); font-size:.9rem;"><strong>Desiccant Pouch Safety:</strong> Follow the manufacturer guidance when recharging. Keep the indicator side facing up, monitor the pouch while heating, and do not exceed the manufacturer’s stated heat limit of <strong>210°F</strong>. If the pouch appears damaged, leaking, or overheated, discard and replace it.</p>

               <p style="background:rgba(255,80,80,0.08); border-left:4px solid #ff6060; padding:.6rem .8rem; border-radius:0 4px 4px 0;"><strong>No SIM card is included</strong> with your Survival Node, and no activation code, carrier plan, or cellular service of any kind is provided. This device has been deep-debloated and OS-modified for offline, off-grid use — it is <strong>not designed to be used with a cellular carrier</strong>. We have not tested it with any carrier or SIM card, and calls, texts, and emergency calls (including 911) may not work even with a SIM installed. Do not purchase expecting cellular voice or data service. Your Survival Node is built for its offline capabilities only.</p>

               <p><strong>Solar Charging — What to Expect:</strong> The integrated solar panel is not designed to keep the phone charged during all-day normal use — and that's fine, because this is not a normal-use device. Under emergency conditions — where you use the phone for a specific task and then power it off — the solar battery can sustain the kit for an extended period of time. Eastern Shore AI founder Chris Gorham has powered his test Survival Node exclusively via solar for over a year without ever connecting it to wall power.</p>
               <p><strong>The rule: use it, then shut it off.</strong> Solar input accumulates while the phone is powered off. Brief emergency sessions draw far less power than the panel can replenish over a day of sunlight. The more disciplined you are about powering the phone off between uses, the longer your solar reserve lasts.</p>
               <p><strong>Daily solar routine:</strong></p>
               <ol>
                 <li>During daylight, leave the solar battery panel-up in direct sun to charge.</li>

    const guideTopicsEl = document.getElementById('topics-guide');
    const appTopicsEl = document.getElementById('topics-apps');
    // Procedures go in the Guide group as bigger tiles; everything else is an app, listed A to Z.
    const guideTopics = new Set(['Initial Setup', 'Maintenance (6-Month Rule)', 'Emergency Deployment', 'Power & Solar Charging',
      'Battery Management', 'EMP Protocol', 'Survival Node Videos', 'Survival Guides (PDF)', 'Troubleshooting', 'Warranty, Legal & Support']);
    const titleEl = document.getElementById('guide-title');
    const contentEl = document.getElementById('guide-content');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let i = 0;

    // App tiles use the app's icon from the phone's home screen (images/guide-icons); the rest get an emoji.
    const topicIcons = {
      'Initial Setup': '🚀', 'Maintenance (6-Month Rule)': '🗓️', 'Emergency Deployment': '🚨',
      'Power & Solar Charging': '☀️', 'Battery Management': '🔋', 'Survival Node User Guide App': 'user-guide',
      'Fennec Browser': 'fennec', 'Organic Maps': 'organic-maps', 'PocketPal': 'pocketpal',
      'F-Droid App Marketplace': 'fdroid', 'Survival Manual App': 'survival-manual', 'Kiwix': 'kiwix',
      'Morse': 'morse', 'Exodus Privacy': 'exodus',
      'Briar Messenger': 'briar', 'Meshtastic': 'meshtastic', 'LocalSend': 'localsend',
      'SOS Flashlight': 'sos-flashlight', 'Fossify File Manager': 'file-manager', 'iFixit': '🔩',
      'Trail Sense': 'trail-sense', 'VLC': 'vlc', 'Translator': 'translator', 'Whisper': 'whisper', 'Survival Node Videos': '🎬', 'Survival Guides (PDF)': '📄', 'EMP Protocol': '🛡️', 'Troubleshooting': '🔧', 'Warranty, Legal & Support': '📋',
    };

    function topicIcon(title) {
      const icon = topicIcons[title];
      if (!icon) return null;
      if (/^[a-z-]+$/.test(icon)) {
        const img = document.createElement('img');
        img.className = 'topic-icon';
        img.src = `/images/guide-icons/${icon}.webp`;
        img.alt = '';
        return img;
      }
      const span = document.createElement('span');
      span.className = 'topic-emoji';
      span.setAttribute('aria-hidden', 'true');
      span.textContent = icon;
      return span;
    }

    function renderTopics() {
      guideTopicsEl.innerHTML = '';
      appTopicsEl.innerHTML = '';
      sections.forEach((s, idx) => {
        const b = document.createElement('button');
        b.className = 'topic-btn' + (idx === i ? ' active' : '');
        b.type = 'button';
        const icon = topicIcon(s.title);
        if (icon) b.appendChild(icon);
        const label = document.createElement('span');
        label.textContent = s.title;
        b.appendChild(label);
        b.addEventListener('click', () => {
          i = idx;
          render();
        });
        (guideTopics.has(s.title) ? guideTopicsEl : appTopicsEl).appendChild(b);
      });
    }

    function render() {
      titleEl.textContent = sections[i].title;
      contentEl.innerHTML = sections[i].html;
      renderTopics();
      prevBtn.disabled = i === 0;
      nextBtn.disabled = i === sections.length - 1;
      prevBtn.style.opacity = i === 0 ? '.45' : '1';
      nextBtn.style.opacity = i === sections.length - 1 ? '.45' : '1';
    }

    prevBtn.addEventListener('click', () => {
      if (i > 0) { i -= 1; render(); }
    });

    nextBtn.addEventListener('click', () => {
      if (i < sections.length - 1) { i += 1; render(); }
    });

    render();

    function buildPrintContainer(phoneFriendly = false) {
      const old = document.getElementById('pdf-print-content');
      if (old) old.remove();

      const container = document.createElement('div');
      container.id = 'pdf-print-content';
      const madeOn = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      if (phoneFriendly) container.classList.add('phone-friendly');

      container.innerHTML =
        '<div class="pdf-title-page">' +
          '<img src="/images/carousel/entirenode/wholekit-gen2.png" class="pdf-logo" alt="Survival Node Gen 2 complete kit" />' +
          '<h1 class="pdf-title-main">Survival Node</h1>' +
          '<p class="pdf-title-sub">User Guide' + (phoneFriendly ? ' · Phone Friendly Version' : '') + '</p>' +
          '<div class="pdf-title-rule"></div>' +
          '<div class="pdf-contact">' +
            '<p class="pdf-contact-name">Eastern Shore AI, LLC</p>' +
            '<p>support@easternshore.ai</p>' +
            '<p>www.easternshore.ai</p>' +
            '<p>PO BOX 317 &middot; Parsonsburg, MD 21849</p>' +
          '</div>' +
          '<p class="pdf-snapshot">This PDF is a copy made on ' + madeOn + ' and doesn\u2019t update. ' +
            'For the current warranty, terms and instructions, use the Survival Node User Guide app on the phone, ' +
            'which offers updates when the phone is online, or visit www.easternshore.ai/terms.html.</p>' +
        '</div>';

      sections.forEach(function(section, idx) {
        const page = document.createElement('div');
        page.className = 'pdf-page' + (idx === 0 ? ' pdf-page-first' : '');
        const cleanHtml = section.html.replace(/ style="[^"]*"/g, '');
        page.innerHTML =
          '<div class="pdf-page-title">' + section.title + '</div>' +
          '<div class="guide-content">' + cleanHtml + '</div>';
        container.appendChild(page);
      });

      document.querySelector('.wrap').appendChild(container);
      return container;
    }

    function cleanupPrintContainer() {
      const c = document.getElementById('pdf-print-content');
      if (c) c.remove();
      window.removeEventListener('afterprint', cleanupPrintContainer);
    }

    document.getElementById('download-pdf-btn').addEventListener('click', function() {
      buildPrintContainer(false);
      window.addEventListener('afterprint', cleanupPrintContainer);
      window.print();
    });

    document.getElementById('download-phone-pdf-btn').addEventListener('click', function() {
      buildPrintContainer(true);
      window.addEventListener('afterprint', cleanupPrintContainer);
      window.print();
    });
  </script>
