name = "eastern-shore-ai-contact"
main = "src/index.js"
compatibility_date = "2026-02-15"

# Workers Logs (Workers Paid: kept 7 days) and crash alerts by email from the
# worker-error-alerts Tail Worker (rentals/worker-alerts).
[observability]
enabled = true

[[tail_consumers]]
service = "worker-error-alerts"

# Daily Ask K summary email at 12:00 UTC (8 AM EDT / 7 AM EST).
[triggers]
crons = ["0 12 * * *"]

# Lets src/index.js import askk-survival-node-knowledge.md as text.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
ALLOWED_ORIGINS = "https://easternshore.ai,https://www.easternshore.ai,https://eastern-shore-ai.99redder.workers.dev,https://99redder.github.io,https://lookahead.easternshore.ai"
TO_EMAIL = "99joefromalamo@gmail.com"
CC_EMAIL = "officerk@agentmail.to"
FROM_EMAIL = "noreply@easternshore.ai"
# Emails that invite a reply (website plan, invoices, quotes, preview confirmations).
CONTACT_FROM_EMAIL = "Eastern Shore AI <contact@easternshore.ai>"
ORDERS_FROM_EMAIL = "orders@easternshore.ai"
ALERTS_FROM_EMAIL = "alerts@easternshore.ai"
BCC_EMAIL = "emailconfirm@easternshore.ai"
VAPID_SUBJECT = "mailto:contact@easternshore.ai"
# Ask K daily spend caps in dollars (estimated from token usage; see src/ask-k-claude.js)
ASKK_CLAUDE_DAILY_BUDGET = "3"
ASKK_MINIMAX_DAILY_BUDGET = "1"
# Anthropic org monthly spend limit; the daily Ask K email shows month-to-date
# Claude spend for all three Ask K deployments against it.
ASKK_ORG_MONTHLY_LIMIT = "200"
# "1" = require the Turnstile bot check (node.html must have TURNSTILE_SITE_KEY set)
ASKK_TURNSTILE_ENFORCE = "1"

# Outgoing email (src/email.js) goes through Cloudflare Email Sending on
# easternshore.ai; if that fails, RESEND_API_KEY (Resend) sends it instead.
# The binding may only send as these four addresses.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@easternshore.ai", "contact@easternshore.ai", "orders@easternshore.ai", "alerts@easternshore.ai"]

# Required secrets (set via `wrangler secret put`): RESEND_API_KEY (email fallback), ADMIN_PASSWORD, TOTP_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, TAX_READ_TOKEN
# Web Push secrets (set via `wrangler secret put`): VAPID_SERVER_PUBLIC_KEY, VAPID_SERVER_PRIVATE_KEY

[[d1_databases]]
binding = "DB"
database_name = "eastern-shore-ai-bookings"
database_id = "59d029fc-5f2b-42af-bdff-c5814a717879"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "eastern-shore-ai-receipts"

[[queues.producers]]
binding = "SUPPORT_PUSH_QUEUE"
queue = "eastern-shore-ai-support-push"

[[queues.consumers]]
queue = "eastern-shore-ai-support-push"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 100

# Email Sending delivery events for easternshore.ai (bounced / failed /
# rejected / spam complaint), delivered by an event subscription on this
# queue. Each one becomes an alert email to TO_EMAIL (src/email-events.js).
[[queues.consumers]]
queue = "eastern-shore-ai-email-events"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 10

# The daily Ask K email (sendAskKDailySummary in src/ask-k-claude.js) also
# covers the other two Ask K deployments: it calls their
# POST /internal/daily-summary through these bindings. Each has its own token
# secret here, which must equal SUMMARY_TOKEN on that worker:
#   JIC_ASKK → SUMMARY_TOKEN, FMG_ASKK → FMG_ASKK_SUMMARY_TOKEN.
[[services]]
binding = "JIC_ASKK"
service = "just-in-case-askk"

# Florence Mae Gifts' Ask K runs on its main API worker.
[[services]]
binding = "FMG_ASKK"
service = "fmg-stripe-api"

# Ask K Assistant (src/ask-k-claude.js): Claude first (newest Opus), MiniMax backup.
# DEPLOY WITH `npx wrangler deploy --config wrangler.toml` — without --config,
# wrangler finds the parent folder's wrangler.jsonc (the static site) first.
# Secrets: ANTHROPIC_API_KEY (Eastern Shore AI Anthropic account),
#          TURNSTILE_SECRET_KEY (bot check), ASKK_PASS_SECRET (signs conversation passes),
#          SUMMARY_TOKEN / FMG_ASKK_SUMMARY_TOKEN (daily email's calls to the
#          Just In Case / Florence Mae Gifts Ask K workers).
# Backup provider secrets (set via `wrangler secret put`):
# - ASKK_API_KEY: API key for the LLM provider (required)
# - ASKK_BASE_URL: provider base URL (optional, defaults to https://api.openai.com/v1)
# - ASKK_MODEL: model identifier (optional, defaults to gpt-4o-mini)
# - ASKK_STAFF_WEBHOOK_URL: webhook URL for escalation notifications (optional)
# - SUPPORT_NOTIFY_TOKEN: dedicated read-only Mac notifier credential
